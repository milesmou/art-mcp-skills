<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>动画交互预览</title>
  <style>
    :root{color-scheme:dark;font:15px "Microsoft YaHei",system-ui,sans-serif;background:#18272d;color:#edf1e6}
    *{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:16px 20px 32px}
    header{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0 0 8px}.sub{color:#b0c7cc;font-size:13px;line-height:1.7;margin:0 0 12px}
    .badge{font-size:12px;border:1px solid #567075;border-radius:20px;padding:5px 10px;color:#c6d6cf;white-space:nowrap}
    .player{border:1px solid #40575e;border-radius:12px;overflow:hidden;background:#213239}
    .viewport{height:min(64vh,620px);min-height:240px;overflow:auto;display:flex;background:#233239}canvas{display:block;margin:auto;flex-shrink:0}
    .controls{padding:13px 15px;background:#2c4148}.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    button,select{font:inherit;color:#edf1e6;border:1px solid #617b81;background:#344e57;border-radius:7px;padding:7px 11px;cursor:pointer}button:hover,select:hover{background:#46606a}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #91dce3;outline-offset:3px}
    button.primary{background:#c5ae75;color:#172b31;border-color:#c5ae75;font-weight:bold;min-width:76px}.transport label{font-size:13px;color:#ccdad6;display:flex;gap:7px;align-items:center}.time{font-variant-numeric:tabular-nums;color:#e9d7ac;margin-left:auto;font-size:13px}
    .scrub{width:100%;margin:16px 0 6px;accent-color:#c9b47f;cursor:pointer}.timeline-row{display:flex;justify-content:space-between;color:#bfd0d0;font-size:12px}.beats{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.beats button{font-size:12px;padding:5px 9px}.beats button.active{color:#1c3036;background:#9bc9c8;border-color:#9bc9c8}
    .info{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0;color:#bdd0d2;font-size:13px;line-height:1.9}.info a,a{color:#a0dbe2}.stage-label{color:#f0d29a;font-weight:bold}details{margin-top:18px;border-top:1px solid #385059;padding-top:13px}summary{cursor:pointer;color:#d6e3df}.refs{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}.refs figure{margin:0}.refs img{width:100%;border-radius:8px}.refs figcaption{color:#b8cbd0;font-size:13px;line-height:1.7;margin-top:7px}.error{padding:18px;color:#ffd1ba}kbd{font:12px monospace;border:1px solid #536970;border-radius:3px;padding:1px 4px}
    @media(max-width:650px){main{padding:12px}h1{font-size:19px}.time{margin-left:0;width:100%}.transport{gap:6px}.transport button{padding:7px 9px}.viewport{height:54vh}.refs{grid-template-columns:1fr}.hint{display:none}}
  </style>
</head>
<body>
<main>
  <header><div><h1 id="title">动画交互预览</h1><p class="sub" id="description">加载预览说明…</p></div><span class="badge" id="status">待确认</span></header>
  <section class="player" aria-label="动作预览播放器">
    <div class="viewport" id="viewport"><canvas id="preview" width="760" height="750" aria-label="动画交互预览画面"></canvas></div>
    <div class="controls">
      <div class="transport">
        <button class="primary" id="play" aria-label="暂停">暂停</button>
        <button id="previous" aria-label="上一帧" title="上一帧（左方向键）">上一帧</button>
        <button id="next" aria-label="下一帧" title="下一帧（右方向键）">下一帧</button>
        <button id="restart" aria-label="从头播放">重播</button>
        <label>速度<select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label>
        <label>画面<select id="zoom" aria-label="画面缩放"><option value="fit">适应窗口</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label>
        <output class="time" id="time" aria-live="off">加载中…</output>
      </div>
      <input class="scrub" id="scrub" type="range" min="0" max="79" step="1" value="0" aria-label="动作时间轴">
      <div class="timeline-row"><span>0.00 s</span><span id="stage" class="stage-label">抱剑停候</span><span id="duration">—</span></div>
      <div class="beats" aria-label="关键动作定位">

      </div>
    </div>
  </section>
  <div class="info"><div><span id="motionNote"></span><br><span class="hint"><kbd>空格</kbd> 播放 / 暂停，<kbd>←</kbd> <kbd>→</kbd> 逐帧。拖动时间轴可检查接触位置。</span></div><div><a id="blueprint" hidden target="_blank">切图 / 补图蓝图</a></div></div>
  <p class="sub"><span id="scope">交互预览载体不代替动作方案或成品验收。</span></p>

</main>
<script>
  const preview=document.getElementById('preview'),ctx=preview.getContext('2d'),viewport=document.getElementById('viewport');
  const play=document.getElementById('play'),scrub=document.getElementById('scrub'),time=document.getElementById('time'),speed=document.getElementById('speed'),zoom=document.getElementById('zoom'),stage=document.getElementById('stage');
  let frames,sheets=[],playing=true,current=0,position=0,last=0,rate=1;
  let beats=[];
  function setPlay(value){playing=value;play.textContent=playing?'暂停':'播放';play.setAttribute('aria-label',play.textContent);last=0;}
  function fit(){if(!frames)return;const value=zoom.value==='fit'?Math.min(viewport.clientWidth/frames.width,viewport.clientHeight/frames.height):Number(zoom.value);preview.style.width=Math.round(frames.width*value)+'px';preview.style.height=Math.round(frames.height*value)+'px';}
  function draw(index){
    current=Math.max(0,Math.min(frames.count-1,index));const local=current%frames.perSheet,sheet=sheets[Math.floor(current/frames.perSheet)];
    ctx.drawImage(sheet,(local%frames.columns)*frames.width,Math.floor(local/frames.columns)*frames.height,frames.width,frames.height,0,0,frames.width,frames.height);
    scrub.value=String(current);const t=current/frames.fps;time.textContent=t.toFixed(2)+' / '+frames.duration.toFixed(2)+' s · '+(current+1)+' / '+frames.count+' 帧';
    const beat=beats.filter(b=>t>=b.start).at(-1);stage.textContent=beat.name;document.querySelectorAll('.beats button').forEach((b,i)=>b.classList.toggle('active',i===beat.id));
  }
  function seek(index){if(!frames)return;setPlay(false);position=Math.max(0,Math.min(frames.count-1,index))/frames.fps;draw(Math.floor(position*frames.fps+1e-5));}
  function tick(now){if(playing&&frames){if(last)position=(position+(now-last)/1000*rate)%frames.duration;const index=Math.min(frames.count-1,Math.floor(position*frames.fps));if(index!==current)draw(index);}last=now;requestAnimationFrame(tick);}
  play.addEventListener('click',()=>setPlay(!playing));document.getElementById('previous').addEventListener('click',()=>seek(current-1));document.getElementById('next').addEventListener('click',()=>seek(current+1));
  document.getElementById('restart').addEventListener('click',()=>{position=0;draw(0);setPlay(true);});scrub.addEventListener('input',()=>seek(Number(scrub.value)));
  speed.addEventListener('change',()=>{rate=Number(speed.value);last=0;});zoom.addEventListener('change',fit);window.addEventListener('resize',fit);document.addEventListener('visibilitychange',()=>{last=0;});
  document.querySelector('.beats').addEventListener('click',event=>{const button=event.target.closest('button[data-frame]');if(button)seek(Number(button.dataset.frame));});
  document.addEventListener('keydown',event=>{if(['INPUT','SELECT','BUTTON'].includes(event.target.tagName))return;if(event.code==='Space'){event.preventDefault();setPlay(!playing);}if(event.code==='ArrowLeft'){event.preventDefault();seek(current-1);}if(event.code==='ArrowRight'){event.preventDefault();seek(current+1);}});
  (async()=>{try{const response=await fetch('frames.json');if(!response.ok)throw new Error('预览数据加载失败');frames=await response.json();
      if(!(frames.width>0&&frames.height>0&&frames.fps>0&&frames.count>0&&frames.perSheet>0&&frames.columns>0&&Array.isArray(frames.sheets)))throw new Error('预览数据不完整');
      frames.duration=frames.duration||frames.count/frames.fps;
      document.getElementById('title').textContent=frames.title||'动画交互预览';document.title=frames.title||'动画交互预览';
      document.getElementById('description').textContent=frames.description||'可暂停、逐帧、慢放并定位关键姿势。';
      document.getElementById('status').textContent=frames.status||'待确认';document.getElementById('duration').textContent=frames.duration.toFixed(2)+' s';
      document.getElementById('motionNote').textContent=frames.motion_note||'';document.getElementById('scope').textContent=frames.scope||'预渲染帧播放器，尚非实时 Spine 骨骼播放。';
      if(frames.blueprint){const link=document.getElementById('blueprint');link.href=frames.blueprint;link.hidden=false;}
      beats=(frames.beats?.length?frames.beats:[{time:0,label:'起始'}]).map((b,i)=>({start:b.time,name:b.label,id:i})).sort((a,b)=>a.start-b.start);if(beats[0].start>0)beats.unshift({start:0,name:'起始',id:-1});beats.forEach((b,i)=>b.id=i);
      const beatButtons=document.querySelector('.beats');beats.forEach(b=>{const button=document.createElement('button');button.textContent=b.name;button.dataset.frame=String(Math.max(0,Math.min(frames.count-1,Math.round(b.start*frames.fps))));beatButtons.appendChild(button);});
      sheets=await Promise.all(frames.sheets.map(name=>new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('预览画面加载失败'));image.src=name;})));preview.width=frames.width;preview.height=frames.height;scrub.max=String(frames.count-1);fit();draw(0);requestAnimationFrame(tick);}catch(error){time.textContent='加载失败';setPlay(false);const message=document.createElement('div');message.className='error';message.textContent=error.message+'。请检查本地预览资源是否齐全。';viewport.replaceChildren(message);}})();
</script>
</body>
</html>
